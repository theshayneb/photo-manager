name: Build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Get ExifTool
        shell: pwsh
        run: ./scripts/get-exiftool.ps1

      - name: Tests (including real ExifTool round trips)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

      - name: Build exe
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          Start-Process -FilePath dist\PhotoManager\PhotoManager.exe -ArgumentList "--self-test", "`"$out`"" -Wait
          Get-Content $out
          $r = Get-Content $out | ConvertFrom-Json
          if (-not $r.ok) { throw "self-test failed" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\PhotoManager -DestinationPath PhotoManager-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoManager-windows
          path: PhotoManager-windows.zip

      # Publish a release for each new version: either a pushed tag, or a push
      # to main whose version (photo_manager/__init__.py) has no release yet.
      - name: Decide release
        id: rel
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ("${{ github.ref }}" -ne "refs/heads/main") { exit 0 }
          $v = (Select-String -Path photo_manager\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          gh release view $v --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $v already exists"; exit 0 }
          "tag=$v" >> $env:GITHUB_OUTPUT
          exit 0  # "gh release view" failing just means no release yet

      - name: Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Photo Manager ${{ steps.rel.outputs.tag }}
          files: PhotoManager-windows.zip
          generate_release_notes: true
